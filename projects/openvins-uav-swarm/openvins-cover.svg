<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenVINS UAV swarm project cover</title>
  <desc id="desc">A stylized visualization of multiple UAV trajectories, camera frames, and a point cloud map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6f4"/>
      <stop offset="1" stop-color="#cfded9"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#0f5e5c"/>
      <stop offset="1" stop-color="#c47e44"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#14201f" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <path d="M0 585 C190 525 240 610 410 548 C590 484 650 390 820 420 C1000 450 1040 310 1200 250 L1200 720 L0 720 Z" fill="#dce9e5"/>
  <g opacity=".42" stroke="#0f5e5c" stroke-width="1">
    <path d="M100 80H1120M100 160H1120M100 240H1120M100 320H1120M100 400H1120M100 480H1120M100 560H1120M100 640H1120"/>
    <path d="M120 60V660M240 60V660M360 60V660M480 60V660M600 60V660M720 60V660M840 60V660M960 60V660M1080 60V660"/>
  </g>
  <path d="M140 520 C230 430 315 492 390 384 S560 236 675 314 S840 540 1040 226" fill="none" stroke="url(#trace)" stroke-width="10" stroke-linecap="round"/>
  <path d="M174 556 C290 610 385 500 486 548 S676 630 840 520 S1010 480 1115 565" fill="none" stroke="#14201f" stroke-width="4" stroke-dasharray="12 16" opacity=".52"/>
  <g fill="#0f5e5c" opacity=".72">
    <circle cx="320" cy="270" r="5"/><circle cx="348" cy="285" r="3"/><circle cx="372" cy="252" r="4"/>
    <circle cx="700" cy="235" r="4"/><circle cx="728" cy="210" r="5"/><circle cx="754" cy="258" r="3"/>
    <circle cx="908" cy="410" r="4"/><circle cx="942" cy="392" r="5"/><circle cx="978" cy="430" r="3"/>
    <circle cx="522" cy="450" r="3"/><circle cx="548" cy="420" r="4"/><circle cx="580" cy="462" r="5"/>
  </g>
  <g filter="url(#soft)">
    <g transform="translate(248 270)">
      <rect x="-54" y="-22" width="108" height="44" rx="8" fill="#14201f"/>
      <path d="M-86 0H86M0-52V52" stroke="#14201f" stroke-width="12" stroke-linecap="round"/>
      <circle r="12" fill="#78d0c6"/>
    </g>
    <g transform="translate(674 314) rotate(8)">
      <rect x="-64" y="-26" width="128" height="52" rx="8" fill="#14201f"/>
      <path d="M-100 0H100M0-62V62" stroke="#14201f" stroke-width="14" stroke-linecap="round"/>
      <circle r="14" fill="#c47e44"/>
    </g>
    <g transform="translate(1015 250) rotate(-14)">
      <rect x="-52" y="-21" width="104" height="42" rx="8" fill="#14201f"/>
      <path d="M-82 0H82M0-50V50" stroke="#14201f" stroke-width="11" stroke-linecap="round"/>
      <circle r="11" fill="#78d0c6"/>
    </g>
  </g>
  <g transform="translate(82 70)">
    <rect width="320" height="136" rx="8" fill="#fbfcfa" opacity=".88"/>
    <text x="28" y="46" fill="#0f5e5c" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">OPENVINS / ROS2 / SWARM</text>
    <text x="28" y="86" fill="#14201f" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">Cooperative localization</text>
    <text x="28" y="114" fill="#5c6c68" font-family="Segoe UI, Arial, sans-serif" font-size="18">Visual-inertial odometry for GPS-denied UAVs</text>
  </g>
</svg>
